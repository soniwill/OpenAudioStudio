<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="100%" height="auto">
  <!-- Background -->
  <rect width="1000" height="420" rx="10" fill="#161719" stroke="#2f3237" stroke-width="2"/>
  <text x="500" y="32" fill="#f0f2f5" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Disparo de Eventos na Unity Timeline (OaeEventTrack e OaeEventClip)</text>

  <!-- Left: Timeline Window Box -->
  <rect x="24" y="54" width="620" height="342" rx="8" fill="#202225" stroke="#26b7d9" stroke-width="2"/>
  <text x="40" y="80" fill="#26b7d9" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">Janela Timeline da Unity (PlayableDirector)</text>
  <text x="490" y="80" fill="#a0a4ab" font-family="Consolas, monospace" font-size="12">Playhead: 00:01.000 (1.0 s)</text>

  <!-- Timeline Ruler -->
  <rect x="40" y="98" width="588" height="26" fill="#1a1c1e" stroke="#33373d" stroke-width="1"/>
  <text x="50" y="115" fill="#a0a4ab" font-family="Consolas, monospace" font-size="11">0:00</text>
  <line x1="50" y1="120" x2="50" y2="124" stroke="#a0a4ab" stroke-width="1"/>
  <text x="180" y="115" fill="#00f5d4" font-family="Consolas, monospace" font-size="11" font-weight="700">1:00 (1.0s)</text>
  <line x1="180" y1="120" x2="180" y2="124" stroke="#00f5d4" stroke-width="2"/>
  <text x="310" y="115" fill="#ffb703" font-family="Consolas, monospace" font-size="11">2:00 (2.0s)</text>
  <line x1="310" y1="120" x2="310" y2="124" stroke="#ffb703" stroke-width="1"/>
  <text x="440" y="115" fill="#a0a4ab" font-family="Consolas, monospace" font-size="11">3:00</text>
  <line x1="440" y1="120" x2="440" y2="124" stroke="#a0a4ab" stroke-width="1"/>
  <text x="570" y="115" fill="#a0a4ab" font-family="Consolas, monospace" font-size="11">4:00</text>

  <!-- Track 1: Normal Audio / Animation (context) -->
  <rect x="40" y="132" width="130" height="54" fill="#282b30" stroke="#33373d"/>
  <text x="50" y="154" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">Cinematic Track</text>
  <text x="50" y="172" fill="#6e7681" font-family="Segoe UI, sans-serif" font-size="10">Animation / Camera</text>
  <rect x="170" y="132" width="458" height="54" fill="#1e2023" stroke="#33373d"/>
  <rect x="180" y="138" width="220" height="42" rx="4" fill="#30363d" stroke="#484f58"/>
  <text x="290" y="164" fill="#c9d1d9" font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle">CameraCut_Intro.anim</text>

  <!-- Track 2: OaeEventTrack (The Focus) -->
  <rect x="40" y="194" width="130" height="74" fill="#1b303a" stroke="#26b7d9" stroke-width="2"/>
  <text x="50" y="218" fill="#26b7d9" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">Audio (OAE)</text>
  <text x="50" y="238" fill="#a0a4ab" font-family="Consolas, monospace" font-size="10">OaeEventTrack</text>
  <text x="50" y="256" fill="#38b000" font-family="Segoe UI, sans-serif" font-size="10">✓ Color: #26b7d9</text>

  <!-- Track 2 Lane & Clip -->
  <rect x="170" y="194" width="458" height="74" fill="#141c22" stroke="#26b7d9"/>
  <!-- OaeEventClip in timeline -->
  <rect x="180" y="200" width="230" height="62" rx="6" fill="#1d4554" stroke="#00f5d4" stroke-width="2"/>
  <text x="192" y="222" fill="#00f5d4" font-family="Consolas, monospace" font-size="12" font-weight="700">OaeEventClip</text>
  <text x="192" y="240" fill="#f0f2f5" font-family="Consolas, monospace" font-size="11">event:/sfx/coin</text>
  <text x="192" y="254" fill="#a0a4ab" font-family="Segoe UI, sans-serif" font-size="10">Início: 1.00s | Duração: 1.80s</text>

  <!-- Curve line representation inside clip -->
  <path d="M 290 252 Q 330 236 390 220" fill="none" stroke="#ffb703" stroke-width="2"/>
  <text x="350" y="232" fill="#ffb703" font-family="Consolas, monospace" font-size="9">ParamCurve</text>

  <!-- Alternative position preview (dotted) at 2s -->
  <rect x="310" y="200" width="230" height="62" rx="6" fill="none" stroke="#ffb703" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="425" y="214" fill="#ffb703" font-family="Segoe UI, sans-serif" font-size="10" text-anchor="middle">Teste a 2.0s (arraste livre)</text>

  <!-- Playhead Red Line -->
  <line x1="180" y1="94" x2="180" y2="280" stroke="#ff5555" stroke-width="2"/>
  <polygon points="174,94 186,94 180,104" fill="#ff5555"/>
  <rect x="68" y="280" width="230" height="24" rx="4" fill="#2d1215" stroke="#ff5555"/>
  <text x="183" y="296" fill="#ff7b72" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Playhead entra no clipe: Disparo!</text>

  <!-- Action callout at bottom of timeline box -->
  <rect x="40" y="318" width="588" height="66" rx="6" fill="#16222b" stroke="#33373d"/>
  <text x="54" y="338" fill="#58a6ff" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">Ciclo de Execução no Editor (Play Mode):</text>
  <text x="54" y="356" fill="#f0f2f5" font-family="Segoe UI, sans-serif" font-size="11">1. <tspan fill="#00f5d4">OnClipEnter(1.0s)</tspan>: Cria EventInstance, aplica volume (1.0 ou 0.5) e chama Start().</text>
  <text x="54" y="374" fill="#f0f2f5" font-family="Segoe UI, sans-serif" font-size="11">2. <tspan fill="#ffb703">OnClipEvaluate</tspan>: Avalia curvas em segundos relativos. 3. <tspan fill="#ff7b72">OnClipExit</tspan>: Stop (AllowFadeout/Immediate).</text>

  <!-- Right: Inspector Box -->
  <rect x="660" y="54" width="316" height="342" rx="8" fill="#202225" stroke="#58a6ff" stroke-width="2"/>
  <text x="818" y="80" fill="#58a6ff" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Inspector: OaeEventClip</text>

  <!-- Inspector Fields -->
  <rect x="674" y="96" width="288" height="52" rx="4" fill="#1b1d21" stroke="#30363d"/>
  <text x="684" y="114" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="11">Event Path [EventRef]</text>
  <rect x="684" y="120" width="268" height="22" rx="3" fill="#282b30" stroke="#00f5d4"/>
  <text x="692" y="135" fill="#00f5d4" font-family="Consolas, monospace" font-size="11">event:/sfx/coin</text>

  <rect x="674" y="156" width="288" height="50" rx="4" fill="#1b1d21" stroke="#30363d"/>
  <text x="684" y="174" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="11">Volume: 1.0 (ou 0.5 para teste)</text>
  <line x1="684" y1="190" x2="952" y2="190" stroke="#484f58" stroke-width="3"/>
  <circle cx="818" cy="190" r="6" fill="#58a6ff"/>

  <rect x="674" y="214" width="288" height="50" rx="4" fill="#1b1d21" stroke="#30363d"/>
  <text x="684" y="232" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="11">Stop Mode</text>
  <rect x="684" y="238" width="268" height="20" rx="3" fill="#282b30" stroke="#30363d"/>
  <text x="692" y="252" fill="#f0f2f5" font-family="Segoe UI, sans-serif" font-size="11">AllowFadeout (ou Immediate)</text>

  <rect x="674" y="272" width="288" height="112" rx="4" fill="#1b1d21" stroke="#ffb703"/>
  <text x="684" y="292" fill="#ffb703" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">Parameter Curves (Opcional)</text>
  <text x="684" y="310" fill="#a0a4ab" font-family="Consolas, monospace" font-size="10">Size: 1</text>
  <text x="684" y="326" fill="#f0f2f5" font-family="Consolas, monospace" font-size="10">└ Parameter Name: &quot;Intensity&quot;</text>
  <rect x="684" y="334" width="268" height="42" rx="3" fill="#161719" stroke="#30363d"/>
  <path d="M 694 366 C 740 366, 780 344, 942 342" fill="none" stroke="#ffb703" stroke-width="2"/>
  <text x="818" y="360" fill="#8b949e" font-family="Segoe UI, sans-serif" font-size="10" text-anchor="middle">Curva no clipe [0s .. 1.8s]</text>
</svg>