<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="100%" height="auto">
  <rect width="1000" height="340" rx="10" fill="#161719" stroke="#2f3237" stroke-width="2"/>
  <text x="500" y="34" fill="#f0f2f5" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Como OpenAudio Studio e Unity Trabalham Juntos</text>

  <!-- Studio Box -->
  <rect x="28" y="64" width="290" height="225" rx="8" fill="#202225" stroke="#00f5d4" stroke-width="2"/>
  <text x="173" y="92" fill="#00f5d4" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" text-anchor="middle">1. OpenAudio Studio (.exe)</text>
  <text x="48" y="122" fill="#f0f2f5" font-family="Segoe UI, sans-serif" font-size="12">• Cria Eventos, Playlists, AHDSR</text>
  <text x="48" y="146" fill="#f0f2f5" font-family="Segoe UI, sans-serif" font-size="12">• Mixa Buses, VCAs e Efeitos DSP</text>
  <text x="48" y="170" fill="#f0f2f5" font-family="Segoe UI, sans-serif" font-size="12">• Clica em Build Bank</text>
  <rect x="46" y="192" width="254" height="76" rx="6" fill="#282b30" stroke="#ffb703"/>
  <text x="173" y="216" fill="#ffb703" font-family="Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">Master.bank</text>
  <text x="173" y="238" fill="#a0a4ab" font-family="Consolas, monospace" font-size="11" text-anchor="middle">Master.bank.catalog.json</text>
  <text x="173" y="258" fill="#a0a4ab" font-family="Segoe UI, sans-serif" font-size="10" text-anchor="middle">(Contém lista de eventos + CRC-32)</text>

  <!-- Arrow 1 -->
  <path d="M324 140 L396 140" stroke="#ffb703" stroke-width="3"/>
  <text x="360" y="128" fill="#ffb703" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Copia p/</text>

  <!-- Unity Project Box -->
  <rect x="402" y="64" width="290" height="225" rx="8" fill="#202225" stroke="#58a6ff" stroke-width="2"/>
  <text x="547" y="92" fill="#58a6ff" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" text-anchor="middle">2. Projeto Unity (Editor)</text>
  <text x="422" y="122" fill="#f0f2f5" font-family="Consolas, monospace" font-size="11">Assets/StreamingAssets/</text>
  <text x="434" y="142" fill="#a0a4ab" font-family="Consolas, monospace" font-size="11">├── Master.bank</text>
  <text x="434" y="160" fill="#a0a4ab" font-family="Consolas, monospace" font-size="11">└── Master.bank.catalog.json</text>
  <text x="422" y="192" fill="#f0f2f5" font-family="Consolas, monospace" font-size="11">Packages/com.openaudio.core</text>
  <text x="422" y="216" fill="#a0a4ab" font-family="Segoe UI, sans-serif" font-size="11">• [EventRef] lê o catálogo</text>
  <text x="422" y="236" fill="#a0a4ab" font-family="Segoe UI, sans-serif" font-size="11">• Plugins/x86_64/oae_audio.dll</text>
  <text x="422" y="258" fill="#38b000" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">✓ Validação CRC-32 automática</text>

  <!-- Arrow 2 -->
  <path d="M698 140 L748 140" stroke="#38b000" stroke-width="3"/>

  <!-- Unity Runtime Box -->
  <rect x="754" y="64" width="218" height="225" rx="8" fill="#202225" stroke="#38b000" stroke-width="2"/>
  <text x="863" y="92" fill="#38b000" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" text-anchor="middle">3. Jogo Rodando</text>
  <text x="770" y="124" fill="#f0f2f5" font-family="Segoe UI, sans-serif" font-size="12">• OaeAudioManager</text>
  <text x="770" y="148" fill="#f0f2f5" font-family="Segoe UI, sans-serif" font-size="12">• StudioBankLoader</text>
  <text x="770" y="172" fill="#f0f2f5" font-family="Segoe UI, sans-serif" font-size="12">• StudioEventEmitter</text>
  <text x="770" y="196" fill="#f0f2f5" font-family="Segoe UI, sans-serif" font-size="12">• StudioListener</text>
  <text x="770" y="220" fill="#f0f2f5" font-family="Segoe UI, sans-serif" font-size="12">• API C# (OaeSystem)</text>
  <text x="770" y="254" fill="#00f5d4" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">↔ LiveClient (TCP :7450)</text>

  <!-- Live-Link Return Arrow -->
  <path d="M863 292 L863 316 L173 316 L173 292" fill="none" stroke="#00f5d4" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="518" y="330" fill="#00f5d4" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Live-Linking: Ajuste volumes e curvas no Studio enquanto joga na Unity em tempo real!</text>
</svg>
